<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <div class="container">
            <a class="nav-box" href="home.html">Go Homepage</a>
            <div class="nav-links">
                <a href="home.html" class="btn">Home</a>
                <a href="register.html" class="btn">Registration</a>
                <a href="users.html" class="btn">Users</a>
                <a href="empty.html" class="btn">Empty</a>
                <button id="modalBtn" class="btn login-button" type="button" aria-haspopup="dialog">Login</button>
            </div>
        </div>
    </nav>
    <main>
        <h2>Users</h2>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>User name</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody id="table"></tbody>
        </table>
    </main>
    <footer>
        <p>JIHC © 2026</p>
    </footer>
    <script>
        let table = document.getElementById("table");

        let savedUsers = localStorage.getItem("users");
        let users = [];

        if (savedUsers !== null) {
            users = JSON.parse(savedUsers);
        }

        if (users.length === 0) {
            let emptyRow = table.insertRow();
            let emptyCell = emptyRow.insertCell();
            emptyCell.colSpan = 3;
            emptyCell.className = "text-center";
            emptyCell.textContent = "No registered users.";
        }

        let userNumber = 0;

        while (userNumber < users.length) {
            let user = users[userNumber];
            let row = table.insertRow();

            let numberCell = row.insertCell();
            numberCell.textContent = userNumber + 1;

            let nameCell = row.insertCell();
            nameCell.textContent = user.name;

            let emailCell = row.insertCell();
            emailCell.textContent = user.email;

            userNumber = userNumber + 1;
        }
    </script>
    <dialog id="loginModal" class="modal" aria-labelledby="loginTitle">
        <h2 id="loginTitle">Login</h2>
        <form id="loginForm">
            <label for="loginEmail">Email</label>
            <input id="loginEmail" name="email" type="email" placeholder="Email" autocomplete="username" required autofocus>
            <label for="loginPassword">Password</label>
            <input id="loginPassword" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
            <p id="loginMessage" role="alert"></p>
            <button class="btn white" type="submit">Submit</button>
            <button id="loginCloseBtn" class="btn white" type="button">Close</button>
        </form>
    </dialog>
    <script src="login.js"></script>
</body>

</html>
