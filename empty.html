<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empty</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="empty">
    <nav>
        <div class="container">
            <a class="nav-box" href="home.html">Welcome Home</a>
            <div class="nav-links">
                <a href="home.html" class="btn">Home</a>
                <a href="register.html" class="btn">Registration</a>
                <a href="users.html" class="btn">Users</a>
                <a href="empty.html" class="btn">Empty</a>
                <button id="modalBtn" class="btn login-button" type="button" aria-haspopup="dialog">Login</button>
            </div>
        </div>
    </nav>
    <main>
        <h2>Empty page</h2>
    </main>
    <footer>
        <p>JIHC © 2026</p>
    </footer>
    <dialog id="loginModal" class="modal" aria-labelledby="loginTitle">
        <h2 id="loginTitle">Login</h2>
        <form id="loginForm">
            <label for="loginEmail">Email</label>
            <input id="loginEmail" name="email" type="email" placeholder="Email" autocomplete="username" required autofocus>
            <label for="loginPassword">Password</label>
            <input id="loginPassword" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
            <p id="loginMessage" role="alert"></p>
            <button class="btn white" type="submit">Submit</button>
            <button id="loginCloseBtn" class="btn white" type="button">Close</button>
        </form>
    </dialog>
    <script src="login.js"></script>
</body>

</html>
